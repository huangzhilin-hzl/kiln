# DeepSeek-V4.1-Flash on one 8x H20-3e node (SM90, 141 GB HBM3e each), vLLM main, AgentX workload.
#   fast tier: GPUs 0-3, TP4, first 8 layers, offline replay of AgentX-derived requests
#              (kiln agentx-export), no spec decode -> quick crash/regression filter
#   slow tier: GPUs 4-7, TP4, full model + DSpark, `vllm serve` measured by the REAL AgentX
#              harness (agentx-harness 1.0.12, public 393-trace corpus, seed 42) -> the score
# If the full model does not fit at TP4 on your checkpoint, use two nodes (slow tier TP8).
name: dsv41-flash-h20-agentx
engine:
  kind: vllm
  model: /path/to/DeepSeek-V4.1-Flash          # MXFP4 checkpoint (NVFP4 needs Blackwell)
  tensor_parallel_size: 4
  max_model_len: 1048576       # AgentX contexts are long (median >140k). If memory is tight use
                               # 262144 + public_dataset semianalysis_cc_traces_weka_062126_256k
  extra_args:
    tokenizer_mode: deepseek_v41
    trust_remote_code: true
    gpu_memory_utilization: 0.85
    enable_prefix_caching: true
    speculative_config: {method: dspark, num_speculative_tokens: 5}
tiers:
  - name: fast
    engine_kind: vllm          # offline LLM, replays traffic_file
    num_layers: 8
    gpus: [0, 1, 2, 3]
    repeats: 3
    trace_kernels: true
    timeout_s: 900
    engine_overrides:
      speculative_config: null # truncated model + DSpark draft is unsafe
  - name: slow
    engine_kind: vllm_server   # vllm serve + AgentX harness
    gpus: [4, 5, 6, 7]
    port: 8200
    repeats: 2                 # each repeat is one AgentX run
    timeout_s: 3600
    agentx:
      concurrency: 8           # sessions; compile once per parallel config, check several later
      public_dataset: semianalysis_cc_traces_weka_062126
      random_seed: 42
      benchmark_duration_s: 600   # null = full-corpus replay (exact InferenceX protocol, slow)
traffic_file: traffic/agentx.jsonl   # kiln agentx-export --tokenizer <model path>
correctness:
  min_token_match: 0.90        # MXFP4 + spec decode drift on long greedy runs; GSM8K before deploy
  num_prompts: 8
  max_new_tokens: 32
agents:
  num_agents: 4
  command: "claude -p --dangerously-skip-permissions"
  budget_hours: 24
workdir: runs
server_url: http://127.0.0.1:8765
