# Real run: Llama-3.2-1B on SGLang (fast tier offline `sglang.Engine` on GPU0,
# slow tier HTTP `sglang.launch_server` on GPU1).
# For single-node shared mode on one GPU/TP group, set `fast.share_engine: slow`
# and `engine.kind: sglang_server` (just like `configs/dsv41_flash_h20_1node.yaml`).
name: llama1b-sglang
engine:
  kind: sglang_offline
  model: meta-llama/Llama-3.2-1B-Instruct
  tensor_parallel_size: 1
  max_model_len: 8192
  extra_args:
    mem_fraction_static: 0.85
tiers:
  - name: fast
    engine_kind: sglang_offline
    num_layers: 4
    gpus: [0]
    repeats: 3
    trace_kernels: true
  - name: slow
    engine_kind: sglang_server
    gpus: [1]
    port: 30000
    repeats: 5
traffic_file: traffic/sample.jsonl     # replace with recorded production traffic or `kiln agentx-export`
correctness:
  min_token_match: 0.98
  num_prompts: 8
  max_new_tokens: 64
agents:
  num_agents: 4
  command: "claude -p --dangerously-skip-permissions"
  budget_hours: 12
workdir: runs
server_url: http://127.0.0.1:8765
