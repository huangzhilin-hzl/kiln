# Real run: Llama-3.2-1B on a 2-GPU box (fast tier on GPU0, slow tier on GPU1).
# For an 8-GPU node with a TP4 model: fast gpus [0,1,2,3], slow gpus [4,5,6,7].
name: llama1b-bs1
engine:
  kind: vllm
  model: meta-llama/Llama-3.2-1B-Instruct
  tensor_parallel_size: 1
  max_model_len: 8192
  extra_args:
    gpu_memory_utilization: 0.85
tiers:
  - {name: fast, num_layers: 4, gpus: [0], repeats: 3, trace_kernels: true}
  - {name: slow, gpus: [1], repeats: 5}
traffic_file: traffic/sample.jsonl     # replace with recorded production traffic
correctness:
  min_token_match: 0.98
  num_prompts: 8
  max_new_tokens: 64
agents:
  num_agents: 4
  command: "claude -p --dangerously-skip-permissions"
  budget_hours: 12
workdir: runs
server_url: http://127.0.0.1:8765
