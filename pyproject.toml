[project]
name = "kiln"
version = "0.1.0"
description = "Continual agentic compilation for LLM inference (a DIY take on Together Compiler / TKCC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["vllm==0.34.0rc1.dev677+g20d8574ef", "torch==2.14.0"]
sglang = ["sglang"]
agentx = ["agentx-harness==1.0.12", "huggingface_hub", "transformers"]   # version pinned in the TKCC paper
dev = ["pytest>=8"]

[project.scripts]
kiln = "kiln.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
