# DeepSeek-V4.1-Flash-1017 on 2x8 H20-3e GPUs (SM90, 141 GB HBM3e/GPU) using SGLang.
#   Node 0 (8x H20-3e, TP8+EP8): `kiln serve` + fast tier (`sglang_offline`, kernel profiler).
#   Node 1 (8x H20-3e, TP8+EP8): slow tier via `kiln worker --tier slow --server http://<NODE0_IP>:18765`
#                                (`sglang.launch_server`).
# Leave `gpus: []` when running under sched/k8s so scheduler-injected CUDA_VISIBLE_DEVICES is preserved.
name: dsv41-flash-h20-sglang
engine:
  kind: sglang_offline
  model: /home/models/DeepSeek-V4.1-Flash-1017
  tensor_parallel_size: 8
  max_model_len: 16384
  extra_args:
    ep_size: 8
    moe_a2a_backend: none
    attention_backend: dsv4
    image_processor_backend: pil
    chunked_prefill_size: 1024
    max_running_requests: 16
    cuda_graph_max_bs_decode: 16
    max_total_tokens: 65536
    mem_fraction_static: 0.85
    moe_runner_backend: flashinfer_mxfp4
    flashinfer_mxfp4_moe_precision: fp8
    random_seed: 0
tiers:
  - name: fast
    engine_kind: sglang_offline
    gpus: []
    max_requests: 16
    repeats: 3
    trace_kernels: true
    timeout_s: 900
  - name: slow
    engine_kind: sglang_server
    gpus: []
    port: 31400
    max_requests: 16
    repeats: 3
    trace_kernels: false
    timeout_s: 1200
traffic_file: traffic/dsv41_smoke.jsonl
correctness:
  min_token_match: 0.85        # MXFP4 + FP8 tie-breaks; short horizon avoids cascade
  num_prompts: 8
  max_new_tokens: 8
agents:
  num_agents: 4
  command: "agy --model {model} --dangerously-skip-permissions --disable-slash-commands --settings '{\"enableTerminalSandbox\":false}' -p {prompt}"
  models:
    - gemini-4-neon-high
    - gemini-4-neon-high
    - gemini-4-carbon-high
    - claude-opus-5-5-high
  budget_hours: 12
  respawn_on_exit: true
workdir: runs
server_url: http://0.0.0.0:18765
