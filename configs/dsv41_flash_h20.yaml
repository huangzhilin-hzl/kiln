# DeepSeek-V4.1-Flash on 2x8 H20-3e GPUs (SM90, 141 GB HBM3e/GPU = 1,128 GB/node), vLLM main, AgentX + agy.
#   Node 0 (8x H20-3e, TP8): job server + fast tier (full 40-layer CED/CSA2 model, 16-request AgentX slice,
#                            kernel profiler, no spec decode) + 4 parallel mixed-model agy agents.
#   Node 1 (8x H20-3e, TP8): slow tier via `kiln worker --tier slow --server http://<NODE0_IP>:8765`
#                            (`vllm serve` + DSpark + real AgentX harness, 393-trace corpus, seed 42).
#   (If all 16 GPUs live on a single host, change slow.gpus to [8,9,10,11,12,13,14,15] and run `kiln serve`.)
name: dsv41-flash-h20-agentx
engine:
  kind: vllm_offline
  model: /home/models/DeepSeek-V4.1-Flash-1017 # MXFP4/FP8 checkpoint (~476 GB; NVFP4 needs Blackwell)
  tensor_parallel_size: 8
  max_model_len: 1048576       # AgentX contexts are long (median >140k). If memory is tight use
                               # 262144 + public_dataset semianalysis_cc_traces_weka_062126_256k
  extra_args:
    tokenizer_mode: deepseek_v41
    language_model_only: true
    trust_remote_code: true
    gpu_memory_utilization: 0.88
    enable_prefix_caching: true
    max_num_batched_tokens: 4096
    max_num_seqs: 128
    max_cudagraph_capture_size: 512
    safetensors_load_strategy: prefetch
    # vLLM EngramConfig defaults cpu_offload=True; set false to keep ~23.6 GiB/GPU Engram in HBM3e.
    # Switch to {cpu_offload: true} for high-concurrency (c>=32) InferenceX alignment.
    engram_config: {cpu_offload: false}
    # Keep real DSpark verification in kiln (do NOT set rejection_sample_method=synthetic here,
    # or greedy correctness probes become non-deterministic).
    speculative_config: {method: dspark, num_speculative_tokens: 5}
tiers:
  - name: fast
    engine_kind: vllm_offline  # Node 0: offline LLM, replays max_requests from traffic_file on all 40 layers
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    max_requests: 16           # keeps fast-tier jobs short without breaking 20+20 CED / kv_source_layer_ids
    repeats: 3
    trace_kernels: true
    timeout_s: 900
    engine_overrides:
      max_model_len: 262144
      speculative_config: null # isolate base-model forward gains & speed up hot-reload graph capture
  - name: slow
    engine_kind: vllm_server   # Node 1: `vllm serve` + DSpark + real AgentX harness
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    port: 8200
    repeats: 1                 # single 900s AgentX run per candidate (fits 8h lease while keeping submission_valid)
    timeout_s: 3600
    engine_overrides:          # OpenAI server CLI flags (vllm serve only; not accepted by offline vllm.LLM)
      tool_call_parser: deepseek_v41
      enable_auto_tool_choice: true
      reasoning_parser: deepseek_v41
    agentx:
      concurrency: 8           # sessions; compile once per parallel config, check several later
      public_dataset: semianalysis_cc_traces_weka_062126
      random_seed: 42
      benchmark_duration_s: 900   # Official InferenceX 900s submission-valid benchmark window
      unsafe_override: false
traffic_file: traffic/agentx.jsonl   # kiln agentx-export --tokenizer <model path> --max-context 262144
correctness:
  min_token_match: 0.85        # MXFP4 + fp8_ds_mla 1-ULP tie-breaks on 150k prompts; short horizon avoids cascade
  num_prompts: 16
  max_new_tokens: 8
agents:
  num_agents: 4
  command: "agy --model {model} --dangerously-skip-permissions --disable-slash-commands --settings '{\"enableTerminalSandbox\":false}' -p {prompt}"
  models:
    - gemini-4-neon-high
    - gemini-4-neon-high
    - gemini-4-carbon-high
    - claude-opus-5-5-high
  # Or mix agy + codex + claude in one fleet using `slots:` (replace `command`/`models` above):
  # slots:
  #   - {provider: agy, model: gemini-4-neon-high, count: 2}
  #   - {provider: codex, model: o3, extra_args: ["-c", "model_reasoning_effort=high"]}
  #   - {provider: claude, model: claude-opus-4-5}
  budget_hours: 24
  respawn_on_exit: true
workdir: runs
server_url: http://0.0.0.0:8765
